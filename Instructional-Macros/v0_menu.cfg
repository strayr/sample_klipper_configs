[menu __main __setup __calib __probe __calibrate_testz_minus_1]
type: command
name: "  -1.0"
gcode:
        TESTZ Z=-1

[menu __main __setup __calib __probe __calibrate_testz_plus_1]
type: command
name: "  +1.0"
gcode:
        TESTZ Z=+1

[menu __main __setup __calib __probe __calibrate_testz_minus_point_1]
type: command
name: "  -0.1"
gcode:
        TESTZ Z=-0.1

[menu __main __setup __calib __probe __calibrate_testz_plus_point_1]
type: command
name: "  +0.1"
gcode:
        TESTZ Z=+0.1

[menu __main __setup __calib __probe __testz_minus]
type: command
name: "   - bisect move" 
gcode:
        TESTZ Z=-

[menu __main __setup __calib __probe __testz_plus]
type: command
name: "   + bisect move" 
gcode:
        TESTZ Z=+

[menu __main __setup __calib __probe __testz_minus_minus]
type: command
name: "   -- return" 
gcode:
        TESTZ Z=--

[menu __main __setup __calib __probe __testz_plus_plus]
type: command
name: "   ++ return"
gcode:
        TESTZ Z=++

####
# This section runs BED_SCREWS_ADJUST
#  Read the fine manual https://www.klipper3d.org/Manual_Level.html#adjusting-bed-leveling-screws 
#  If you don't adjust a screw hit Accept Screw, keep going until Accept Screw does nothing.
##

[menu __main __setup __calib __bed]
type: list
name: Bed Screws (Manual)
enable: { (not printer.idle_timeout.state == "Printing") and (printer.configfile.settings.bed_screws)}

[menu __main __setup __calib __bed __start]
type: command
name: Start
enable: {not printer.idle_timeout.state == "Printing" }
gcode:
    G28
    BED_SCREWS_ADJUST

[menu __main __setup __calib __bed __adjust]
type: command
name: Screw Adjusted
enable: {not printer.idle_timeout.state == "Printing" }
gcode:
    ADJUSTED
[menu __main __setup __calib __bed __accept]
type: command
name: Accept Screw
enable: {not printer.idle_timeout.state == "Printing" }
gcode:
    ACCEPT

[menu __main __setup __calib __bed __abort]
type: command
name: Abort Procedure
enable: {not printer.idle_timeout.state == "Printing" }
gcode:
    ABORT