####
# This section Calibrates the Z Endstop and Z-Probe if they are present
##

[menu __main __setup __calib __probe]
type: list
name: Z Endstop / Probe
enable: {not printer.idle_timeout.state == "Printing"}

[menu __main __setup __calib __probe __beginzesc]
type: command
enable: {(not printer.idle_timeout.state == "Printing") and (not printer.configfile.settings.stepper_z[endstop_pin: probe:z_virtual_endstop])}
name: Calibrate Endstop
gcode:
    G28 
    G0 X {printer.toolhead.axis_maximum.x / 2} Y {printer.toolhead.axis_maximum.y / 2}
    G0 Z 10
    Z_ENDSTOP_CALIBRATE


[menu __main __setup __calib __probe __accept]
type: command
name: Accept
enable: {not printer.idle_timeout.state == "Printing"}
gcode:
        ACCEPT
        # WE REALLY WANT TO PUT THE TOOLHEAD SOMEWHEWRE SAFE BEFORE SAVE_CONFIG
        G0 Z 30
        M117 SAVE_CONFIG now!


[menu __main __setup __calib __probe __abort]
type: command
name: Abort
enable: {not printer.idle_timeout.state == "Printing"}
gcode:
    ABORT
    G0 Z 30

